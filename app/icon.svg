<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- 猫脸背景圆形 -->
  <circle cx="16" cy="17" r="12" fill="#FF6B4A"/>

  <!-- 左耳朵 -->
  <path d="M8 10 L6 3 L12 7 Z" fill="#FF6B4A"/>
  <path d="M9 9 L7.5 4.5 L11 7.5 Z" fill="#FFE4D6"/>

  <!-- 右耳朵 -->
  <path d="M24 10 L26 3 L20 7 Z" fill="#FF6B4A"/>
  <path d="M23 9 L24.5 4.5 L21 7.5 Z" fill="#FFE4D6"/>

  <!-- 脸部 -->
  <ellipse cx="16" cy="18" rx="10" ry="9" fill="#FF8F7A"/>

  <!-- 眼睛 -->
  <ellipse cx="12" cy="16" rx="2.5" ry="3" fill="#2C3E50"/>
  <ellipse cx="20" cy="16" rx="2.5" ry="3" fill="#2C3E50"/>
  <circle cx="12.8" cy="15" r="0.8" fill="white"/>
  <circle cx="20.8" cy="15" r="0.8" fill="white"/>

  <!-- 鼻子 -->
  <path d="M15 19 L17 19 L16 20.5 Z" fill="#FFE4D6"/>

  <!-- 嘴巴 -->
  <path d="M16 20.5 Q14 22 12.5 21" stroke="#2C3E50" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M16 20.5 Q18 22 19.5 21" stroke="#2C3E50" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- 胡须 -->
  <line x1="6" y1="17" x2="10" y2="18" stroke="#FFE4D6" stroke-width="0.5" stroke-linecap="round"/>
  <line x1="6" y1="19" x2="10" y2="19" stroke="#FFE4D6" stroke-width="0.5" stroke-linecap="round"/>
  <line x1="6" y1="21" x2="10" y2="20" stroke="#FFE4D6" stroke-width="0.5" stroke-linecap="round"/>
  <line x1="26" y1="17" x2="22" y2="18" stroke="#FFE4D6" stroke-width="0.5" stroke-linecap="round"/>
  <line x1="26" y1="19" x2="22" y2="19" stroke="#FFE4D6" stroke-width="0.5" stroke-linecap="round"/>
  <line x1="26" y1="21" x2="22" y2="20" stroke="#FFE4D6" stroke-width="0.5" stroke-linecap="round"/>
</svg>