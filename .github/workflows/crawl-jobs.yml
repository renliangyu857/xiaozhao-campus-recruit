name: 每日职位爬取与更新

on:
  # 定时触发：每天早上9:00
  schedule:
    - cron: '0 1 * * *'  # UTC时间，对应北京时间早上9:00

  # 手动触发
  workflow_dispatch:

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    # 凭据统一在 job 级注入，爬虫通过 process.env 读取（不进源码）
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
      UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}
      PAPERBALL_COOKIE: ${{ secrets.PAPERBALL_COOKIE }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 运行职位爬取脚本
        run: npm run crawl:jobs

      - name: 失败时飞书告警
        if: failure()
        run: |
          if [ -n "$FEISHU_WEBHOOK_URL" ]; then
            curl -s -X POST "$FEISHU_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d '{"msg_type":"text","content":{"text":"⚠️ 校招职位爬取任务失败，请检查 GitHub Actions 运行日志（很可能是 paperball-edu Cookie 过期，需重新在 Secrets 中更新 PAPERBALL_COOKIE）"}}'
          fi
