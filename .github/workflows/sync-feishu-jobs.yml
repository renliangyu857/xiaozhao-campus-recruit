name: paperball-edu 岗位同步（含手动补数据）

on:
  # 每天北京时间 09:30（UTC 01:30）
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      from_date:
        description: '增量起始日期 YYYY-MM-DD（留空=默认昨天上海日期）。例如补 9.16-9.23 填 2026-09-16。'
        type: string
        required: false
        default: ''
      full_backfill:
        description: '全量回填（覆盖 from_date；首次启用或大改后勾）'
        type: boolean
        default: false

jobs:
  sync-feishu-jobs:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAPERBALL_COOKIE: ${{ secrets.PAPERBALL_COOKIE }}
      FROM_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.from_date || '' }}
      FULL_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_backfill == true && '1' || '0' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 应用数据库迁移
        run: npx prisma migrate deploy

      - name: 同步 paperball-edu 岗位（含 from_date 回填）
        run: node scripts/crawl-jobs.js
        env:
          PAPERBALL_COOKIE: ${{ secrets.PAPERBALL_COOKIE }}
          FROM_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.from_date || '' }}
          FULL_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_backfill == true && '1' || '0' }}