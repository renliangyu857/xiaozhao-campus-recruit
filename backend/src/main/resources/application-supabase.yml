# 使用 Supabase（PostgreSQL）时的配置（可选）
# 启动方式：
#   SPRING_PROFILES_ACTIVE=supabase
# 或
#   mvn spring-boot:run -Dspring-boot.run.profiles=supabase
#
# 建议通过环境变量传入连接信息，避免把密码写进仓库：
#   SUPABASE_DB_URL=jdbc:postgresql://<host>:<port>/<db>
#   SUPABASE_DB_USER=...
#   SUPABASE_DB_PASSWORD=...
spring:
  datasource:
    url: jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?user=postgres.pokvkjvbhacvvtphnvrx&password=rensumo1010*
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: public
        format_sql: true
