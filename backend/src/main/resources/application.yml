spring:
  application:
    name: campusrecruit-backend
  datasource:
    url: jdbc:mysql://localhost:3306/campusrecruit?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  session:
    store-type: redis
  profiles:
    active: supabase,upstash

server:
  port: 8080
  servlet:
    context-path: /api

# 免费查询每日次数；新用户体验VIP天数（0表示不自动开通）
app:
  max-free-queries: 3
  trial-vip-days: 2
  # 会员套餐价位与标签，可通过此处或环境变量调整，由 GET /vip/plans 接口下发
  vip:
    plans:
      # 1_month:
      #   price: 8.8
      #   originalPrice: 19.9
      #   tag: 尝鲜
      # 3_month: 默认 16.6 / 超值推荐，可覆盖
      #   price: 16.6
      #   originalPrice: 49.9
      #   tag: 超值推荐
