spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
  session:
    store-type: none

# 测试环境不设 context-path，MockMvc 直接请求 /jobs；不自动开通体验会员
app:
  max-free-queries: 3
  trial-vip-days: 0

# 微信登录与支付：stub 模式下 code 即 openid，支付不调真实接口
wechat:
  stub: true
  pay:
    stub: true
